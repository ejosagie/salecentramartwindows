name: salecentra_mart
description: SaleCentra Mart — Supermarket POS for Android and Windows
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  http: ^1.1.0
  uuid: ^4.2.1
  crypto: ^3.0.3
  pdf: ^3.10.7
  printing: ^5.11.1
  google_fonts: ^6.1.0
  url_launcher: ^6.2.2
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  windows: "launcher_icon"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
